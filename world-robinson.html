<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界のロビンソン｜早稲田インスペクション</title><style>body{font-family:-apple-system,"Hiragino Sans",sans-serif;max-width:700px;margin:auto;padding:24px;background:#f5f6f8;color:#172637;line-height:1.7}main{background:white;border-radius:16px;padding:24px}button,a.action{display:inline-block;border:0;border-radius:12px;padding:14px 18px;margin:8px 4px 8px 0;background:#234966;color:white;font-size:17px;text-decoration:none;cursor:pointer}a.action{background:#d52c49}h1{font-size:26px}#selection{font-size:20px;font-weight:bold}small{color:#505b66}</style></head><body><a href="index.html">← ホームへ戻る</a><main><h1>🌏 世界のロビンソン</h1><p>スピッツ「ロビンソン」の原曲やカバーをApple Musicで探して楽しむページです。</p><p id="selection" aria-live="polite"></p><button id="next" type="button">次のロビンソンを探す ↻</button><a id="listen" class="action" target="_blank" rel="noopener noreferrer">Apple Musicで探す ↗</a><p><small>検索結果から聴きたい演奏を選んでください。曲の配信状況やフル再生はApple Musicの利用条件によります。自動再生・音源の転載は行いません。</small></p></main><script>const songs=[{label:"スピッツ｜ロビンソン（原曲）",q:"スピッツ ロビンソン"},{label:"ロビンソン｜アコースティック・カバーを探す",q:"ロビンソン アコースティック カバー"},{label:"ロビンソン｜英語カバーを探す",q:"Robinson Spitz English cover"},{label:"ロビンソン｜ピアノ・カバーを探す",q:"ロビンソン ピアノ カバー"},{label:"ロビンソン｜海外のカバーを探す",q:"Spitz Robinson cover"}];let i=-1;function next(){i=(i+1)%songs.length;document.getElementById("selection").textContent=songs[i].label;document.getElementById("listen").href="https://music.apple.com/jp/search?term="+encodeURIComponent(songs[i].q)}document.getElementById("next").addEventListener("click",next);next();</script></body></html>
