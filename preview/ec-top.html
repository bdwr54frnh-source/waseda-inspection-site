<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【プレビュー】ECトップ｜Elementary Code</title>
<link rel="stylesheet" href="preview.css">
<style>
  body {
    margin: 0;
    background: #060a14;
    color: #e8ecf2;
  }
  .preview-banner { background: #1a2840; }
  nav.preview-nav { background: rgba(10,16,28,0.92); border-color: rgba(255,255,255,0.08); }
  nav.preview-nav a { background: rgba(255,255,255,0.06); color: #b8d4ff; border-color: rgba(255,255,255,0.12); }
  nav.preview-nav a[aria-current="page"] { background: #3d5a80; color: #fff; }
  main h1, main h2 { color: #d4e4ff; }
  .lead { color: #a8bdd4; }
  .note { color: #b4c2d6; font-weight: 500; }
  .ec-hero {
    display: grid;
    gap: 16px;
    margin-bottom: 20px;
  }
  @media (min-width: 640px) {
    .ec-hero { grid-template-columns: 1fr 1fr; align-items: center; }
  }
  .ec-visual img {
    width: 100%;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .card {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.1);
    color: #e8ecf2;
  }
  .world-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: baseline;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    padding: 12px;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .world-strip .sep { color: #6b8ab8; }
  footer.preview-foot { color: #9aadc8; font-weight: 500; border-color: rgba(255,255,255,0.08); }
  footer.preview-foot a { color: #9ec5ff; }
</style>
</head>
<body>
<p class="preview-banner">非公開 · Elementary Code 専用（雲・ロビンソン不使用）</p>
<nav class="preview-nav">
  <a href="index.html">入口</a>
  <a href="company-top.html">会社</a>
  <a href="app-top.html">アプリ</a>
  <a href="ec-top.html" aria-current="page">EC</a>
  <a href="../support.html">サポート</a>
  <a href="../privacy.html">プライバシー</a>
</nav>
<main>
  <h1>Elementary Code</h1>
  <p class="lead">パスワードレス · ナンバーレス · 接続直前の即時認証。Air Face / Plug Lock と連携する独立レイヤー。</p>
  <div class="ec-hero">
    <div class="ec-visual">
      <img src="../assets/elementarycode_x_ios_poster.jpg" alt="ELEMENTARYCODE × iOS — 100% iOS へ">
    </div>
    <div class="ec-visual">
      <img src="../assets/hp_promo_elementary_code_infographic.jpg" alt="Elementary Code プロモ — 地球・世界時刻">
    </div>
  </div>
  <div class="card">
    <h2 style="margin-top:0;">世界時刻（横並び · 折返し）</h2>
    <div class="world-strip" id="world-strip" aria-live="polite"></div>
    <p class="note" style="margin:10px 0 0;"><a href="https://elementarycode.tokyo/#world-clocks" target="_blank" rel="noopener" style="color:#9ec5ff;">elementarycode.tokyo — 全195地域</a></p>
  </div>
  <p class="note"><a href="../elementary-code.html" style="color:#9ec5ff;">当サイトの EC 説明</a></p>
</main>
<footer class="preview-foot">
  <a href="https://elementarycode.tokyo/" target="_blank" rel="noopener">elementarycode.tokyo</a>
</footer>
<script>
(function () {
  var samples = [
    { n: "東京", tz: "Asia/Tokyo" },
    { n: "ロンドン", tz: "Europe/London" },
    { n: "NY", tz: "America/New_York" },
    { n: "パリ", tz: "Europe/Paris" },
    { n: "シドニー", tz: "Australia/Sydney" }
  ];
  var el = document.getElementById("world-strip");
  function render() {
    var parts = [];
    samples.forEach(function (s, i) {
      var t = new Intl.DateTimeFormat("ja-JP", { timeZone: s.tz, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
      parts.push("<span>" + s.n + " " + t + "</span>");
      if (i < samples.length - 1) parts.push('<span class="sep" aria-hidden="true">■</span>');
    });
    el.innerHTML = parts.join("");
  }
  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
